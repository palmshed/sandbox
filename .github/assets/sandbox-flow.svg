<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="880" viewBox="0 0 2000 880" font-family="Menlo, 'SF Mono', Monaco, 'Courier New', monospace">
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4 L0,8 z" fill="#f2f2f2"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="2000" height="880" fill="#1c1c1c"/>

  <!-- accent palette -->
  <!-- validated #6fae7a   blocked #c9a24b   planned #8a8a8a -->

  <!-- ================== TOP: runtime spec (source of truth) ================== -->
  <rect x="610" y="34" width="780" height="64" rx="10" fill="none" stroke="#f2f2f2" stroke-width="2"/>
  <text x="1000" y="76" fill="#f2f2f2" font-size="27" text-anchor="middle">runtime spec 1.3.0  (frozen 1.0.0 contract)</text>
  <path d="M760,98 L300,206" fill="none" stroke="#6a6a6a" stroke-width="1.6" stroke-dasharray="8 8"/>
  <path d="M1240,98 L1300,184" fill="none" stroke="#6a6a6a" stroke-width="1.6" stroke-dasharray="8 8"/>

  <!-- ================== LEFT: SDK / caller ================== -->
  <rect x="70" y="210" width="340" height="350" fill="none" stroke="#f2f2f2" stroke-width="2.5"/>
  <text x="240" y="284" fill="#f2f2f2" font-size="46" text-anchor="middle">palmshed</text>
  <text x="240" y="320" fill="#9a9a9a" font-size="21" text-anchor="middle">sandbox SDK</text>
  <text x="240" y="354" fill="#9a9a9a" font-size="19" text-anchor="middle">@palmshed/sandbox</text>

  <g font-size="24" fill="#e6e6e6">
    <text x="140" y="408">TS</text>
    <text x="140" y="444">RS</text>
    <text x="140" y="480">GO</text>
    <text x="140" y="516">PY</text>
    <text x="230" y="408">1.3.0</text>
    <text x="230" y="444">0.1.0</text>
    <text x="230" y="480">0.1.0</text>
    <text x="230" y="516">0.1.0</text>
  </g>
  <text x="306" y="408" fill="#8a8a8a" font-size="14">reference</text>

  <!-- ================== MIDDLE: exec() call ================== -->
  <text x="650" y="200" fill="#f2f2f2" font-size="36" text-anchor="middle">exec()</text>
  <rect x="470" y="222" width="360" height="92" rx="12" fill="none" stroke="#f2f2f2" stroke-width="2.5"/>
  <text x="650" y="280" fill="#f2f2f2" font-size="27" text-anchor="middle">sandbox.exec({ cmd })</text>

  <!-- ================== MIDDLE: capability negotiation gate ================== -->
  <rect x="500" y="372" width="300" height="106" rx="10" fill="none" stroke="#f2f2f2" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="650" y="412" fill="#dedede" font-size="22" text-anchor="middle">capability negotiation</text>
  <text x="650" y="446" fill="#8a8a8a" font-size="16" text-anchor="middle">flags probed per backend</text>

  <!-- ================== RIGHT: sandbox backend ================== -->
  <rect x="1010" y="186" width="560" height="474" rx="10" fill="none" stroke="#f2f2f2" stroke-width="2.5" stroke-dasharray="12 12"/>
  <text x="1042" y="232" fill="#dedede" font-size="26">exec session</text>

  <!-- terminal window -->
  <rect x="1042" y="248" width="230" height="140" rx="8" fill="none" stroke="#f2f2f2" stroke-width="2.5"/>
  <line x1="1042" y1="280" x2="1272" y2="280" stroke="#f2f2f2" stroke-width="1.5"/>
  <circle cx="1064" cy="264" r="5" fill="#f2f2f2"/>
  <circle cx="1084" cy="264" r="5" fill="#f2f2f2"/>
  <circle cx="1104" cy="264" r="5" fill="#f2f2f2"/>
  <path d="M1068,318 l34,24 l-34,24" fill="none" stroke="#f2f2f2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1120" y="358" width="56" height="5" fill="#f2f2f2"/>

  <line x1="1042" y1="416" x2="1538" y2="416" stroke="#5a5a5a" stroke-width="1.4"/>

  <!-- backend lanes -->
  <g font-size="23" fill="#e6e6e6">
    <circle cx="1056" cy="452" r="7" fill="#6fae7a"/>
    <text x="1078" y="460">Native</text>
    <text x="1250" y="460" font-size="18" fill="#6fae7a">validated</text>

    <circle cx="1056" cy="496" r="7" fill="#6fae7a"/>
    <text x="1078" y="504">Docker</text>
    <text x="1250" y="504" font-size="18" fill="#6fae7a">validated</text>

    <circle cx="1056" cy="540" r="7" fill="#c9a24b"/>
    <text x="1078" y="548">Firecracker</text>
    <text x="1250" y="548" font-size="18" fill="#c9a24b">design, P1-blocked</text>

    <circle cx="1056" cy="584" r="7" fill="#8a8a8a"/>
    <text x="1078" y="592">WASI</text>
    <text x="1250" y="592" font-size="18" fill="#8a8a8a">planned</text>
  </g>
  <line x1="1042" y1="616" x2="1538" y2="616" stroke="#5a5a5a" stroke-width="1.4"/>
  <text x="1042" y="644" fill="#8a8a8a" font-size="16">capabilities negotiated per backend, not assumed</text>

  <!-- ================== RIGHT-MOST: what exec does ================== -->
  <g fill="#e6e6e6" font-size="24">
    <text x="1612" y="300">&#8226; Run processes</text>
    <text x="1612" y="350">&#8226; Isolate filesystem</text>
    <text x="1612" y="400">&#8226; Limit CPU, memory, disk</text>
    <text x="1612" y="450">&#8226; Stream stdout, stderr</text>
    <text x="1612" y="500">&#8226; Network policy</text>
  </g>

  <!-- ================== BOTTOM: captured result ================== -->
  <text x="440" y="648" fill="#f2f2f2" font-size="34">Captured result</text>
  <rect x="430" y="666" width="760" height="148" rx="10" fill="none" stroke="#f2f2f2" stroke-width="2.5"/>
  <g fill="#e6e6e6" font-size="27">
    <text x="462" y="712">{ exitCode: 0,</text>
    <text x="462" y="754">&#160;&#160;stdout: "...",</text>
    <text x="462" y="796">&#160;&#160;stderr: "" }</text>
  </g>
  <text x="430" y="840" fill="#8a8a8a" font-size="16">streaming: stdout/stderr chunks where the contract supports it</text>
  <text x="430" y="862" fill="#8a8a8a" font-size="16">truncated: true when the bounded retention limit is exceeded</text>

  <!-- ================== ARROWS ================== -->
  <!-- SDK -> exec() -->
  <path d="M412,300 C 442,300 452,268 468,268" fill="none" stroke="#f2f2f2" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- exec() -> capability gate -->
  <line x1="650" y1="314" x2="650" y2="369" stroke="#f2f2f2" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- capability gate -> backend -->
  <path d="M800,425 C 860,425 940,425 1006,425" fill="none" stroke="#f2f2f2" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- backend -> bullets -->
  <line x1="1572" y1="340" x2="1604" y2="340" stroke="#f2f2f2" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- backend -> captured result -->
  <path d="M1400,660 C 1410,708 1330,718 1206,712" fill="none" stroke="#f2f2f2" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- captured result -> back to SDK -->
  <path d="M428,740 C 300,740 240,640 240,562" fill="none" stroke="#f2f2f2" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
