name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'sdk/typescript/package-lock.json'

      - name: Install SDK Dependencies
        run: cd sdk/typescript && npm ci

      - name: Build TypeScript Reference SDK
        run: cd sdk/typescript && npm run build

      - name: Run SDK Unit & Stress Tests
        run: cd sdk/typescript && npm test

      - name: Run Compliance Suite & TCK
        shell: bash
        run: node --test compliance/sdk/*.test.js compliance/backends/*.test.js tck/*/*.test.js

      # Repro laboratory: network repros auto-skip when networkIsolation is
      # unavailable on the host (Windows, or Linux CI where unprivileged user
      # namespaces are restricted). On macOS they assert full RFC 0004 isolation.
      - name: Run Repro Laboratory
        shell: bash
        run: node repro/run.js

  # Supported Node.js runtime matrix (LTS versions). The package declares
  # "engines": { "node": ">=20" }; 20 (Iron) and 22 (Jod) are the maintained
  # LTS lines. The 3-OS matrix above runs on the primary line (20); this job
  # validates the engine contract across all supported LTS lines on every
  # supported OS.
  node-lts:
    name: node-lts (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: 'sdk/typescript/package-lock.json'

      - name: Install SDK Dependencies
        run: cd sdk/typescript && npm ci

      - name: Build TypeScript Reference SDK
        run: cd sdk/typescript && npm run build

      - name: Run SDK Unit & Stress Tests
        run: cd sdk/typescript && npm test

      - name: Run Compliance Suite & TCK
        shell: bash
        run: node --test compliance/sdk/*.test.js compliance/backends/*.test.js tck/*/*.test.js
