name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'sdk/typescript/package-lock.json'

      - name: Install SDK Dependencies
        run: cd sdk/typescript && npm ci

      - name: Build TypeScript Reference SDK
        run: cd sdk/typescript && npm run build

      - name: Run SDK Unit Tests
        run: cd sdk/typescript && npm test

      - name: Run Compliance Suite & TCK
        run: node --test compliance/sdk/*.test.js compliance/backends/*.test.js tck/*/*.test.js
