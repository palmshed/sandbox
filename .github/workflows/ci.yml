name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  # Primary runtime line (Node 20) across all OSes. Runs the SAME scripts as
  # `npm run preflight` (scripts/verify-*.mjs), so a green local preflight
  # predicts a green CI run.
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'sdk/typescript/package-lock.json'

      - name: Verify SDK (deps, typecheck, build, unit & stress tests)
        run: node scripts/verify-sdk.mjs

      - name: Verify Compliance Suite & TCK
        run: node scripts/verify-conformance.mjs

      # Repro laboratory: network repros auto-skip when networkIsolation is
      # unavailable on the host (Windows, or Linux CI where unprivileged user
      # namespaces are restricted). On macOS they assert full RFC 0004 isolation.
      - name: Verify Repro Laboratory
        run: node scripts/verify-repro.mjs

  # Supported Node.js runtime matrix (LTS versions). The package declares
  # "engines": { "node": ">=20" }; 20 (Iron) and 22 (Jod) are the maintained
  # LTS lines. The 3-OS matrix above runs on the primary line (20); this job
  # validates the engine contract across all supported LTS lines on every
  # supported OS.
  node-lts:
    name: node-lts (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: 'sdk/typescript/package-lock.json'

      - name: Verify SDK (deps, typecheck, build, unit & stress tests)
        run: node scripts/verify-sdk.mjs
