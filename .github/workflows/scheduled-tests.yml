name: Scheduled SDK Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  scheduled-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      # Same script as `npm run preflight`; installs deps, typechecks, builds,
      # and runs the SDK unit/stress suite.
      - name: Build & Run SDK Test Suite
        run: node scripts/verify-sdk.mjs

  # Nightly (cron 3am) sustained soak against the packed release artifact.
  # Uses the same entry point as production.yml and `npm run production:validate`,
  # with a longer soak window.
  nightly-soak:
    if: github.event_name == 'schedule' && github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Nightly soak (5 min, 25 sandboxes) against packed artifact
        run: node scripts/production-validate.mjs --soak-only --verbose
        env:
          PRODUCTION_SOAK_MINUTES: '5'
          PRODUCTION_SOAK_SANDBOXES: '25'

  # Nightly exact-version gate: the packaged version and spec/version.md must
  # match exactly, and a matching git tag must exist. Drift here means
  # spec-first governance was bypassed. Runs the same script as the release
  # pipeline version gate.
  nightly-version-gate:
    if: github.event_name == 'schedule' && github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Verify exact version alignment (package vs spec vs tag)
        run: node scripts/verify-release.mjs --check-tag-exists
