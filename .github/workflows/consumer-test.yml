name: Consumer Test

on:
  push:
    branches: [ main, master ]
    paths:
      - 'sdk/typescript/src/**'
      - 'sdk/typescript/package.json'
      - 'examples/consumer-test/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'sdk/typescript/src/**'
      - 'sdk/typescript/package.json'
      - 'examples/consumer-test/**'

permissions:
  contents: read

jobs:
  consumer-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # Same script as `npm run preflight`. run.sh builds, packs, installs
      # from tarball into an isolated consumer project, and verifies against
      # the packed artifact (never the workspace source). The version is
      # resolved dynamically, so version bumps never break this fixture. The
      # script restores the consumer fixture files afterward.
      - name: Run isolated consumer integration test (tarball)
        run: node scripts/verify-consumer.mjs

  # Published-package consumer suite: download the real npm artifact, install
  # it into a clean temporary consumer project, and run the shared verify.ts
  # suite (same scenarios as the tarball job, npm provenance). The package
  # spec defaults to @latest, which is what an external consumer installs.
  # Evidence is uploaded per platform.
  registry-consumer:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Run published-package consumer suite
        shell: bash
        run: bash examples/consumer-test/run-published.sh --package @palmshed/sandbox@latest --evidence "consumer-evidence-${{ matrix.os }}.json"

      - name: Upload consumer evidence
        uses: actions/upload-artifact@v4
        with:
          name: consumer-evidence-${{ matrix.os }}
          path: consumer-evidence-${{ matrix.os }}.json
          if-no-files-found: error
          retention-days: 30
