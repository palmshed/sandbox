name: Consumer Test

on:
  push:
    branches: [ main, master ]
    paths:
      - 'sdk/typescript/src/**'
      - 'sdk/typescript/package.json'
      - 'examples/consumer-test/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'sdk/typescript/src/**'
      - 'sdk/typescript/package.json'
      - 'examples/consumer-test/**'

permissions:
  contents: read

jobs:
  consumer-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # Same script as `npm run preflight`. run.sh builds, packs, installs
      # from tarball into an isolated consumer project, and verifies against
      # the packed artifact (never the workspace source). The version is
      # resolved dynamically, so version bumps never break this fixture. The
      # script restores the consumer fixture files afterward.
      - name: Run isolated consumer integration test (tarball)
        run: node scripts/verify-consumer.mjs

  # Phase 1: verify installation directly from the npm registry (not a local
  # tarball). This checks that the published package is installable and that
  # the public API surface works for an external consumer.
  registry-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install @palmshed/sandbox from npm registry (beta tag)
        run: |
          mkdir -p /tmp/registry-consumer && cd /tmp/registry-consumer
          npm init -y > /dev/null
          npm install @palmshed/sandbox@beta --no-audit --no-fund

      - name: Verify registry package exports and execution
        run: |
          cd /tmp/registry-consumer
          node -e "
            const { Sandbox } = require('@palmshed/sandbox');
            (async () => {
              const s = await Sandbox.create({ backend: 'native', timeout: 5000 });
              const e = await s.exec('echo registry-ok');
              await e.wait();
              if (e.exitCode !== 0 || !/registry-ok/.test(e.stdout())) {
                throw new Error('registry package execution failed');
              }
              console.log('registry install OK, version=' + require('@palmshed/sandbox/package.json').version);
              await s.destroy();
            })().catch((err) => { console.error(err); process.exit(1); });
          "
