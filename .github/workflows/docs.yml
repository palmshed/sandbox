name: Documentation Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify READMEs Existence
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f spec/README.md
          test -f backends/README.md
          test -f sdk/README.md
          test -f compliance/README.md
          test -f tck/README.md
          test -f rfcs/README.md
          test -f examples/README.md
          test -f .github/workflows/README.md
