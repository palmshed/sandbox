name: Documentation Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  punctuation-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Hard-fails on Unicode em dashes in prose; warns on prose "--".
      # Technical syntax (code fences, inline code, --- rules, table
      # separators, CLI flags, POSIX --) is preserved.
      - name: Documentation punctuation check
        run: node scripts/punctuation-check.mjs

  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Same required-doc list as `npm run preflight:quick`.
      - name: Verify required READMEs exist
        run: node scripts/verify-docs.mjs --no-typedoc

  generate-api-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'sdk/typescript/package-lock.json'
      # Fails the build if the public API can no longer be documented
      # (broken exports, unresolved TSDoc), so the reference cannot drift
      # silently. Output is gitignored (sdk/typescript/typedoc/).
      - name: Generate API Reference Docs (Typedoc)
        run: node scripts/verify-docs.mjs
