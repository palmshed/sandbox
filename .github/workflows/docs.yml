name: Documentation Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  punctuation-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Hard-fails on Unicode em dashes in prose; warns on prose "--".
      # Technical syntax (code fences, inline code, --- rules, table
      # separators, CLI flags, POSIX --) is preserved.
      - name: Documentation punctuation check
        run: node scripts/punctuation-check.mjs

  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify READMEs Existence
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f spec/README.md
          test -f backends/README.md
          test -f sdk/README.md
          test -f compliance/README.md
          test -f tck/README.md
          test -f rfcs/README.md
          test -f examples/README.md
          test -f .github/workflows/README.md
          test -f docs/api.md
          test -f docs/errors.md
          test -f docs/release-readiness.md
          test -f sdk/typescript/README.md

  generate-api-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'sdk/typescript/package-lock.json'
      - name: Install SDK Dependencies
        run: cd sdk/typescript && npm ci
      - name: Generate API Reference Docs (Typedoc)
        # Fails the build if the public API can no longer be documented
        # (broken exports, unresolved TSDoc), so the reference cannot drift
        # silently. Output is gitignored (sdk/typescript/typedoc/).
        run: cd sdk/typescript && npm run docs
      - name: Verify Generated Output
        run: test -f sdk/typescript/typedoc/index.html
