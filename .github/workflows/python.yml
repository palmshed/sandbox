name: Python SDK

# F3 contract gate: pytest suite on all three OSes across the supported
# Python floor (3.11) and the current stable line, plus the consumer
# lifecycle. Informational until the py-v0.1.0 release decision.
on:
  push:
    branches: [ main, master ]
    paths:
      - 'sdk/python/**'
      - '.github/workflows/python.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'sdk/python/**'
      - '.github/workflows/python.yml'

permissions:
  contents: read

jobs:
  python-test:
    name: python-test (${{ matrix.os }} / Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python: [ '3.11', '3.14' ]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'
          cache-dependency-path: sdk/python/pyproject.toml

      - name: Install test dependencies
        run: python -m pip install "./sdk/python[test]"

      # Contract suite (normative ports plus Python-specific concurrency,
      # retention, and cancellation coverage).
      - name: Contract suite
        run: python -m pytest sdk/python/tests/ -q

      - name: Consumer (full lifecycle)
        run: python examples/eval.py
        working-directory: sdk/python
