name: Examples

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'examples/**'
      - 'sdk/typescript/src/**'
      - 'sdk/typescript/package.json'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'examples/**'
      - 'sdk/typescript/src/**'
      - 'sdk/typescript/package.json'

permissions:
  contents: read

jobs:
  examples:
    name: examples (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # Same script as `npm run preflight`. Builds, packs, and installs the
      # release artifact into the repo-root node_modules, then runs all four
      # examples against the packed package (never the workspace build).
      - name: Run examples against packed artifact
        run: node scripts/verify-examples.mjs
