name: Examples

on:
  push:
    branches: [ main, master ]
    paths:
      - 'examples/**'
      - 'sdk/typescript/src/**'
      - 'sdk/typescript/package.json'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'examples/**'
      - 'sdk/typescript/src/**'
      - 'sdk/typescript/package.json'

jobs:
  examples:
    name: examples (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build SDK
        run: cd sdk/typescript && npm ci && npm run build

      # The examples import the '@palmshed/sandbox' package name, so they must
      # run against the packed release artifact, not the workspace build. npm
      # install copies the tarball into the repo-root node_modules (a real
      # install, not a symlink), so resolution matches an external consumer.
      - name: Pack and install SDK artifact
        shell: bash
        run: |
          cd sdk/typescript
          PACKFILE=$(npm pack --silent | tail -n 1)
          cd ..
          npm install --no-save --no-audit --no-fund --omit=dev "./sdk/typescript/$PACKFILE"

      - name: Run Quickstart example
        run: node examples/quickstart.mjs

      - name: Run AI Agent Runner example
        run: node examples/ai-agent-runner.mjs

      - name: Run Code Evaluator example
        run: node examples/code-evaluator.mjs

      - name: Run CI Runner example
        run: node examples/ci-runner.mjs
