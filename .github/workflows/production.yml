name: Production Validation Suite

on:
  push:
    branches: [ main, master ]
    paths:
      - 'sdk/typescript/src/**'
      - 'sdk/typescript/package.json'
      - 'production/**'
      - '.github/workflows/production.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'sdk/typescript/src/**'
      - 'sdk/typescript/package.json'
      - 'production/**'
      - '.github/workflows/production.yml'

permissions:
  contents: read

jobs:
  production-suite:
    name: production (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Build SDK
        run: npm ci
        working-directory: sdk/typescript

      - name: Build TypeScript
        run: npm run build
        working-directory: sdk/typescript

      # The production suite validates the packed artifact a consumer installs,
      # never the workspace build.
      - name: Pack and install release artifact
        shell: bash
        run: |
          PACKFILE=$(cd sdk/typescript && npm pack --silent | tail -n 1)
          npm install --no-save "./sdk/typescript/$PACKFILE"
          node -e "const p=require('@palmshed/sandbox/package.json'); console.log('installed @palmshed/sandbox v'+p.version)"

      - name: Run production validation suite
        shell: bash
        run: node production/run.mjs

      - name: Quick soak smoke (2 min)
        shell: bash
        run: node production/soak/soak.mjs --minutes 2 --sandboxes 5
