name: Production Validation Suite

on:
  push:
    branches: [ main, master ]
    paths:
      - 'sdk/typescript/src/**'
      - 'sdk/typescript/package.json'
      - 'production/**'
      - '.github/workflows/production.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'sdk/typescript/src/**'
      - 'sdk/typescript/package.json'
      - 'production/**'
      - '.github/workflows/production.yml'

permissions:
  contents: read

jobs:
  production-suite:
    name: production (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # Same script as `npm run production:validate`. Builds, packs, and
      # installs the release artifact, runs the full production scenario suite
      # against the packed package (never the workspace build), then runs a
      # soak smoke.
      - name: Validate packed artifact (production suite + soak)
        run: node scripts/production-validate.mjs
        env:
          PRODUCTION_SOAK_MINUTES: '2'
          PRODUCTION_SOAK_SANDBOXES: '5'
