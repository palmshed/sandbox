name: Performance Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build & Run Benchmark Checks
        run: cd sdk/typescript && npm ci && npm test
