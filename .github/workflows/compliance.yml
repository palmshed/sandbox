name: Compliance & TCK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build SDK
        run: cd sdk/typescript && npm ci && npm run build

      - name: Verify Specification & Compliance Contract
        run: node --test compliance/sdk/*.test.js compliance/backends/*.test.js tck/*/*.test.js
