name: Compliance & TCK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  conformance:
    name: conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'sdk/typescript/package-lock.json'

      - name: Build SDK
        run: cd sdk/typescript && npm ci && npm run build

      - name: Verify Specification & Compliance Contract
        run: node --test compliance/sdk/*.test.js compliance/backends/*.test.js tck/*/*.test.js
